# Independent origin vhost; regional MCP locations use hearthpulse.net SNI.
# Login/site requests continue to use the existing Arena origin vhost.
server {
    listen 151.80.21.140:443 ssl;
    listen [2001:41d0:c:c8c::]:443 ssl;
    server_name hearthpulse.net;
    if ($arena_allowed_origin_source = 0) { return 444; }
    ssl_certificate /etc/letsencrypt/live/hearthpulse.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hearthpulse.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/manacost-mcp-origin.conf;
    location / { return 404; }
}

# Isolated resolver for Boosty: the host resolver intermittently fails this name.
server {
    listen 127.0.0.1:3112;
    server_name localhost;
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    access_log off;
    error_log /var/log/nginx/manacost-mcp-boosty.error.log warn;
    location = /v1/blog/kolodahearthstone/post/ {
        if ($request_method != GET) { return 405; }
        set $boosty_api api.boosty.to;
        proxy_pass https://$boosty_api$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name api.boosty.to;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 4;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host api.boosty.to;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_buffering off;
        proxy_cache off;
    }
    location / { return 404; }
}
