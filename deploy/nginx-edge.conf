# Include inside the hearthpulse.net HTTPS server on existing regional edges.
# Keep existing origin tunnels; select the independent MCP vhost by TLS SNI.
location = /mcp {
    proxy_pass https://hs_arena_origin;
    include /etc/nginx/snippets/manacost-mcp-edge-transport.conf;
    proxy_buffering off;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}
location ^~ /mcp/ {
    proxy_pass https://hs_arena_origin;
    include /etc/nginx/snippets/manacost-mcp-edge-transport.conf;
    proxy_buffering off;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    access_log off;
    error_log /dev/null crit;
}
location = /.well-known/oauth-protected-resource/mcp {
    proxy_pass https://hs_arena_origin;
    include /etc/nginx/snippets/manacost-mcp-edge-transport.conf;
    proxy_cache off;
}
location = /.well-known/oauth-authorization-server/mcp {
    proxy_pass https://hs_arena_origin;
    include /etc/nginx/snippets/manacost-mcp-edge-transport.conf;
    proxy_cache off;
}
