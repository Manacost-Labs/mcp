proxy_ssl_server_name on;
proxy_ssl_name hearthpulse.net;
proxy_ssl_verify on;
proxy_ssl_verify_depth 4;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_ssl_session_reuse off;
proxy_set_header Connection "";
proxy_set_header Host hearthpulse.net;
proxy_set_header X-Forwarded-Host hearthpulse.net;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header CF-Connecting-IP $remote_addr;
proxy_set_header Accept-Encoding "";
proxy_redirect off;
# Nginx retries connection failures, but does not replay sent POST requests.
# Never enable the non_idempotent option for OAuth token/consent requests.
proxy_next_upstream error timeout;
