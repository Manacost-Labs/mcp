# Include at the existing application origin (arena.hs-manacost.ru).
# Regional hearthpulse.net edges preserve that SNI/Host for origin transport.
# No existing login/API/site locations are replaced.
location = /mcp {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host hearthpulse.net;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 60s;
}
location ^~ /mcp/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host hearthpulse.net;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
    access_log off;
    error_log /dev/null crit;
}
location = /.well-known/oauth-protected-resource/mcp {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host hearthpulse.net;
}
location = /.well-known/oauth-authorization-server/mcp {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host hearthpulse.net;
}
